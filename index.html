<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reise ins Innere des PCs — Ausbau</title>
<style>
  :root {
    --bg: #faf9f7; --rahmen: #e2ded7; --muted: #6b6862; --akzent: #2f6f8f;
    --rot: #a33a2a; --gruen: #3f7a4a; --text: #1b1a18;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
           padding: 14px 22px; border-bottom: 2px solid var(--rahmen); }
  header h1 { font-size: 20px; margin: 0; }
  header .kicker { color: var(--muted); font-size: 14px; }
  #fortschritt { margin-left: auto; font-weight: 700; color: var(--akzent); }
  main { display: flex; gap: 22px; padding: 18px 22px 28px; align-items: flex-start; }
  .buehne { flex: 1 1 auto; min-width: 0; }
  svg.pc { height: 66vh; max-width: 100%; display: block; margin: 0 auto; }

  .teil { cursor: pointer; }
  .teil:hover { filter: drop-shadow(0 0 5px var(--akzent)); }
  .teil.weg { opacity: 0; pointer-events: none; transition: opacity .35s; }
  .lab { font: 600 13px -apple-system, "Segoe UI", sans-serif; fill: #35322e; pointer-events: none; }
  .lab.hell { fill: #f2efe9; }

  #werkbank { margin-top: 10px; border-top: 2px solid var(--rahmen); padding-top: 10px; }
  #werkbank h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
                 color: var(--muted); margin: 0 0 8px; }
  #kacheln { display: flex; flex-wrap: wrap; gap: 8px; min-height: 62px; }
  .kachel { width: 92px; border: 1px solid var(--rahmen); border-radius: 8px; background: #fff;
            padding: 4px; text-align: center; }
  .kachel svg { width: 100%; height: 42px; }
  .kachel span { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  #leer { color: var(--muted); font-size: 14px; font-style: italic; }
  body.einbau .kachel { cursor: pointer; }
  body.einbau .kachel:hover { border-color: var(--akzent); box-shadow: 0 0 0 2px rgba(47,111,143,.15); }
  button.antwort { display: block; width: 100%; text-align: left; margin-top: 6px; }

  /* Grosser Dialog fuer Moduswechsel und Fragen */
  #overlay { position: fixed; inset: 0; z-index: 10; padding: 24px;
             background: rgba(27,26,24,.55); display: flex; align-items: center; justify-content: center; }
  #overlay[hidden] { display: none; }
  .dialog { background: #fff; border-radius: 16px; padding: 30px 34px; max-width: 660px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: auf .18s ease-out; }
  @keyframes auf { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
  .dialog h2 { margin: 0 0 10px; font-size: 30px; line-height: 1.15; }
  .dialog .frage { font-size: 22px; line-height: 1.4; margin: 6px 0 20px; }
  .dialog .woher { font-size: 14px; color: var(--muted); margin: -12px 0 18px; }
  .dialog button.antwort { font-size: 17px; line-height: 1.35; padding: 14px 18px; margin-top: 10px; }
  .dialog button.gross { font-size: 19px; font-weight: 600; padding: 13px 26px;
                         background: var(--akzent); color: #fff; border-color: var(--akzent); }
  .dialog button.gross:hover { background: #26596f; color: #fff; }
  .dialog .rueck { font-size: 18px; line-height: 1.4; padding: 14px 16px; border-radius: 10px; margin: 0 0 18px; }
  .dialog .rueck.gut { background: #eaf5ec; color: var(--gruen); }
  .dialog .rueck.fehler { background: #fbeeec; color: var(--rot); }
  .dialog .zeile { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  body.einbau header { background: #eef3f6; }

  aside { flex: 0 0 340px; }
  .meldung { border-radius: 8px; padding: 10px 12px; font-size: 15px; margin-bottom: 12px;
             border-left: 4px solid var(--muted); background: #fff; }
  .meldung.fehler { border-left-color: var(--rot); color: var(--rot); }
  .meldung.gut { border-left-color: var(--gruen); color: var(--gruen); }
  .karte { border: 1px solid var(--rahmen); border-radius: 10px; background: #fff; padding: 14px 16px; }
  .karte h2 { margin: 0 0 2px; font-size: 19px; }
  .rolle { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
           text-transform: uppercase; color: #fff; background: var(--akzent);
           border-radius: 20px; padding: 2px 10px; margin-bottom: 10px; }
  .karte p { margin: 0 0 10px; font-size: 15px; line-height: 1.5; }
  .karte .wie { border-top: 1px dashed var(--rahmen); padding-top: 10px; font-size: 14px; color: var(--muted); }
  .karte .wie b { color: var(--text); }
  button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px;
           border: 1px solid var(--rahmen); background: #fff; cursor: pointer; margin-top: 12px; }
  button:hover { border-color: var(--akzent); color: var(--akzent); }
  table.eva { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0 4px; }
  table.eva td { padding: 4px 0; vertical-align: top; }
  table.eva td:first-child { font-weight: 700; width: 108px; color: var(--akzent); }
</style>
</head>

<script>
const TEILE = {
  netzkabel: {
    name: "Netzkabel", rolle: "Sicherheit", braucht: [],
    text: "<p>Bevor irgendetwas anderes passiert: Stecker raus. Ein Computer ist auch im ausgeschalteten Zustand mit dem Stromnetz verbunden — das Netzteil steht unter Spannung, und im Netzteil sitzen Kondensatoren, die die Ladung noch eine Weile halten.</p><p>Zweite Regel, gleich danach: Fass einmal das blanke Metall des Gehäuses an, bevor du ein Bauteil anfasst. Damit lädst du dich statisch ab. Eine Entladung, die du nicht einmal spürst, kann einen Chip zerstören.</p>",
    wie: "<b>So geht es:</b> Kaltgerätestecker hinten am Netzteil abziehen, dann den Stecker aus der Steckdose."
  },
  seitenwand: {
    name: "Seitenwand", rolle: "Gehäuse", braucht: ["netzkabel"],
    text: "<p>Das Gehäuse hält alle Teile an ihrem Platz, schirmt sie ab und lenkt den Luftstrom: vorne kühle Luft rein, hinten warme raus. Deshalb läuft ein offener Rechner nicht automatisch kühler.</p>",
    wie: "<b>So geht es:</b> Die zwei Rändelschrauben an der Rückseite lösen, die Wand ein Stück nach hinten schieben, dann abheben."
  },
  grafikkarte: {
    name: "Grafikkarte", rolle: "Ausgabe", braucht: ["seitenwand"],
    text: "<p>Die Grafikkarte rechnet aus, was auf dem Monitor erscheint — sie gehört im EVA-Prinzip zur <b>Ausgabe</b>. Sie ist im Grunde ein kleiner Computer im Computer: eigener Prozessor (GPU) und eigener Speicher.</p><p>Sie steckt in einem PCIe-Steckplatz. Weil sie viel Strom braucht, hängt oft ein extra Kabel vom Netzteil daran.</p>",
    wie: "<b>So geht es:</b> Schraube am Slotblech lösen, das Stromkabel abziehen, die Halteklammer am Ende des Steckplatzes herunterdrücken, dann gerade herausziehen."
  },
  ram: {
    name: "Arbeitsspeicher (RAM)", rolle: "Speicher · flüchtig", braucht: ["seitenwand"],
    text: "<p>Im RAM liegt das, womit die CPU <b>gerade jetzt</b> arbeitet: das laufende Programm und seine Daten. Er ist sehr schnell — aber flüchtig: Strom weg, Inhalt weg. Genau deshalb ist ungespeicherte Arbeit nach einem Stromausfall verloren.</p><p>Das ist der Kern der Von-Neumann-Idee: Im selben Speicher liegen <b>Daten und Programm</b> — beides als Zahlen. Deshalb kann ein Rechner alles ausführen, was man ihm lädt, statt nur eine fest eingebaute Aufgabe zu können.</p><p>Üblich sind heute 8 oder 16 <b>Gigabyte</b>.</p>",
    wie: "<b>So geht es:</b> Die Klemmen an beiden Enden des Steckplatzes nach außen drücken — der Riegel springt von selbst ein Stück heraus."
  },
  ssd: {
    name: "SSD (Massenspeicher)", rolle: "Speicher · dauerhaft", braucht: ["seitenwand"],
    text: "<p>Hier liegen Betriebssystem, Programme und deine Dateien — auch ohne Strom. Beim Start wird alles, was gebraucht wird, von der SSD in den RAM geladen.</p><p>Der Unterschied zur alten Festplatte: keine Scheibe, kein Schreibkopf, keine beweglichen Teile, sondern Speicherzellen wie in einem USB-Stick. Das macht sie schneller und unempfindlicher gegen Erschütterung.</p><p>Zum Größenvergleich: 1 <b>Terabyte</b> sind rund 1000 Gigabyte — etwa 60-mal so viel wie der Arbeitsspeicher. Ein Handyfoto braucht ungefähr 4 Megabyte; davon passen rund 250 000 auf die SSD.</p>",
    wie: "<b>So geht es:</b> Erst das Datenkabel (SATA) und das Stromkabel abziehen, dann die Schrauben am Laufwerkskäfig lösen."
  },
  netzteil: {
    name: "Netzteil", rolle: "Versorgung", braucht: ["seitenwand"],
    text: "<p>Das Netzteil verarbeitet keine Daten. Es macht aus den 230 Volt Wechselspannung der Steckdose die Gleichspannungen, die die Bauteile brauchen: 12 V, 5 V und 3,3 V.</p><p>Von hier gehen die dicken Kabelstränge ab — der breite 24-polige Stecker zum Mainboard, ein weiterer zur CPU, dazu Stecker für Laufwerke und Grafikkarte.</p>",
    wie: "<b>So geht es:</b> Alle Stecker abziehen (am Stecker anfassen, nicht am Kabel), dann die vier Schrauben an der Gehäuserückseite lösen."
  },
  kuehler: {
    name: "CPU-Kühler", rolle: "Versorgung", braucht: ["seitenwand"],
    text: "<p>Die CPU wird im Betrieb über 70 °C heiß. Der Kühlkörper nimmt die Wärme auf, seine Lamellen vergrößern die Fläche, der Lüfter bläst sie weg. Ohne Kühler taktet ein Prozessor nach Sekunden herunter oder schaltet ab.</p><p>Zwischen CPU und Kühler sitzt Wärmeleitpaste — eine hauchdünne Schicht, die die letzten Luftspalte füllt. Beim Wiedereinbau muss sie erneuert werden.</p>",
    wie: "<b>So geht es:</b> Lüfterkabel vom Mainboard abziehen, die vier Halteklammern lösen, den Kühler leicht drehen und abheben — er klebt an der Paste."
  },
  cpu: {
    name: "Prozessor (CPU)", rolle: "Verarbeitung", braucht: ["seitenwand", "kuehler"],
    text: "<p>Das ist das <b>V</b> im EVA-Prinzip. Die CPU holt einen Befehl aus dem Speicher, entschlüsselt ihn, führt ihn aus und schreibt das Ergebnis zurück — und das milliardenfach pro Sekunde. Dieser Ablauf ist der Von-Neumann-Zyklus.</p><p>Innen sind es zwei Teile: das Rechenwerk, das rechnet und vergleicht, und das Steuerwerk, das die Befehle holt und den Ablauf steuert.</p>",
    wie: "<b>So geht es:</b> Den Hebel am Sockel entriegeln, den Bügel öffnen, die CPU <b>senkrecht</b> herausheben. Nur an den Kanten anfassen, nie an den Kontakten."
  },
  mainboard: {
    name: "Mainboard", rolle: "Verarbeitung", braucht: ["seitenwand", "grafikkarte", "ram", "cpu", "netzteil", "ssd"],
    text: "<p>Das Mainboard verbindet alles miteinander. Die feinen Leiterbahnen sind die Straßen, über die Daten fahren — der Bus. Der Chipsatz regelt, wer wann fahren darf.</p><p>Es liefert auch die Steckplätze und Anschlüsse: Sockel für die CPU, Bänke für den RAM, PCIe für die Grafikkarte, SATA und USB nach außen.</p>",
    wie: "<b>So geht es:</b> Die letzten Kabel zur Gehäusefront abziehen, die neun Schrauben lösen, das Board vorsichtig nach vorne aus der Blende ziehen."
  }
};

const EINBAU = {
  mainboard: [], ssd: [], netzteil: [],
  cpu: ["mainboard"], ram: ["mainboard"], grafikkarte: ["mainboard"], kuehler: ["cpu"],
  seitenwand: ["mainboard","cpu","kuehler","ram","grafikkarte","ssd","netzteil"],
  netzkabel: ["netzteil","seitenwand"]
};
const EINBAUTEXT = {
  mainboard: "Erst das Mainboard ins Gehäuse — daran steckt alles andere.",
  cpu: "Erst die CPU in den Sockel, dann der Kühler darauf.",
  netzteil: "Ohne Netzteil kein Netzkabel.",
  seitenwand: "Die Seitenwand kommt zuletzt — sonst kommst du nicht mehr an die Teile.",
  netzkabel: "Strom ganz zum Schluss."
};
const TEILFRAGE = {
  netzkabel: { f: "Warum muss der Stecker raus, bevor man das Gehäuse öffnet?",
    a: ["Im Netzteil steht auch nach dem Ausschalten noch Spannung.",
        "Sonst startet der Rechner von allein.",
        "Damit man die Kabel besser sieht."], r: 0 },
  seitenwand: { f: "Wozu ist das geschlossene Gehäuse gut?",
    a: ["Es lenkt den Luftstrom: vorne kühle Luft rein, hinten warme raus.",
        "Es macht den Rechner schneller.",
        "Es speichert Daten."], r: 0 },
  grafikkarte: { f: "Wofür ist die Grafikkarte da?",
    a: ["Sie berechnet das Bild für den Monitor — das ist Ausgabe.",
        "Sie speichert Dateien dauerhaft.",
        "Sie versorgt die anderen Teile mit Strom."], r: 0 },
  ram: { f: "Was passiert mit dem Inhalt des Arbeitsspeichers, wenn der Strom weg ist?",
    a: ["Er ist weg — der RAM ist flüchtig.",
        "Er wird automatisch auf die SSD gerettet.",
        "Er bleibt etwa drei Tage erhalten."], r: 0 },
  ssd: { f: "Was liegt auf der SSD?",
    a: ["Betriebssystem, Programme und Dateien — auch ohne Strom.",
        "Nur das, womit gerade gearbeitet wird.",
        "Das Bild für den Monitor."], r: 0 },
  netzteil: { f: "Was macht das Netzteil?",
    a: ["Es macht aus 230 V die 12 V, 5 V und 3,3 V für die Bauteile.",
        "Es rechnet Daten aus.",
        "Es kühlt den Prozessor."], r: 0 },
  kuehler: { f: "Warum braucht die CPU einen Kühler?",
    a: ["Sie wird über 70 °C heiß und würde sonst abschalten.",
        "Damit der Rechner leiser wird.",
        "Damit der Strom besser fließt."], r: 0 },
  cpu: { f: "Was macht die CPU?",
    a: ["Sie holt Befehle aus dem Speicher, führt sie aus und schreibt das Ergebnis zurück.",
        "Sie speichert Dateien dauerhaft.",
        "Sie erzeugt das Bild für den Monitor."], r: 0 },
  mainboard: { f: "Was ist die Aufgabe des Mainboards?",
    a: ["Es verbindet alle Teile — über den Bus laufen die Daten.",
        "Es kühlt die CPU.",
        "Es holt den Strom aus der Steckdose."], r: 0 }
};

const FRAGEN = [
  { f: "Du schreibst einen Text, der Strom fällt aus — der Text ist weg. Warum?",
    a: ["Er lag im Arbeitsspeicher, und der ist flüchtig.", "Die SSD war zu langsam.",
        "Die CPU war zu heiß.", "Das Netzteil hat den Text gelöscht."],
    r: 0, w: "Der RAM verliert seinen Inhalt, sobald der Strom weg ist. Gespeichert ist etwas erst auf der SSD." },
  { f: "Wo liegt ein Programm, während es läuft?",
    a: ["Im Arbeitsspeicher, zusammen mit seinen Daten.", "In der CPU.",
        "Auf der Grafikkarte.", "Im Netzteil."],
    r: 0, w: "Das ist die Von-Neumann-Idee: Programm und Daten liegen im selben Speicher. Die CPU holt sich die Befehle von dort." },
  { f: "Was ist mehr: 16 GB Arbeitsspeicher oder 1 TB SSD?",
    a: ["Die SSD — ungefähr 60-mal so viel.", "Der Arbeitsspeicher.",
        "Beides gleich viel.", "Das kann man nicht vergleichen."],
    r: 0, w: "1 TB sind rund 1000 GB. Dafür ist der RAM viel schneller — und leer, sobald der Strom weg ist." }
];

const REIHENFOLGE = ["netzkabel","seitenwand","grafikkarte","ram","ssd","netzteil","kuehler","cpu","mainboard"];
const SPERRTEXT = {
  netzkabel: "Am Rechner wird nicht gearbeitet, solange er am Strom hängt. Zieh zuerst den Netzstecker.",
  seitenwand: "Da kommst du nicht ran — die Seitenwand ist noch drauf.",
  kuehler: "Auf der CPU sitzt der Kühler. Der muss zuerst herunter.",
  rest: "Das Mainboard kommt zuletzt. Darauf steckt noch: "
};

const raus = new Set();
const drin = new Set();
let modus = "ausbau";
let fehlversuche = 0;
let richtigeTeile = 0;
const svg = document.querySelector("svg.pc");
const kacheln = document.getElementById("kacheln");
const meldung = document.getElementById("meldung");
const karte = document.getElementById("karte");
const fortschritt = document.getElementById("fortschritt");

const START = `<h2>Ein Rechner, neun Teile</h2>
  <p>Vor dir steht ein geöffneter PC. Bau ihn Stück für Stück auseinander — aber nicht in beliebiger
  Reihenfolge: Manches liegt unter etwas anderem, und eine Regel steht ganz am Anfang.</p>
  <p>Zu jedem Teil erfährst du, wofür es da ist und wie man es ausbaut.</p>
  <div class="wie"><b>Tipp:</b> Fang bei dem an, was nichts mit dem Inneren des Rechners zu tun hat.</div>`;

const overlay = document.getElementById("overlay");
const dialog = document.getElementById("dialog");
function zeigeDialog(html) { dialog.innerHTML = html; overlay.hidden = false; }
function zuDialog() { overlay.hidden = true; }

function sagen(txt, art) {
  meldung.className = "meldung" + (art ? " " + art : "");
  meldung.innerHTML = txt;
}

function zeigen(id) {
  const t = TEILE[id];
  karte.innerHTML = `<h2>${t.name}</h2><div class="rolle">${t.rolle}</div>${t.text}<div class="wie">${t.wie}</div>`;
}

function warum(id) {
  const fehlt = TEILE[id].braucht.filter(b => !raus.has(b));
  if (fehlt.includes("netzkabel")) return SPERRTEXT.netzkabel;
  if (fehlt.includes("seitenwand")) return SPERRTEXT.seitenwand;
  if (id === "mainboard") return SPERRTEXT.rest + fehlt.map(f => TEILE[f].name).join(", ") + ".";
  if (fehlt.includes("kuehler")) return SPERRTEXT.kuehler;
  return "Das geht so noch nicht.";
}

function aufWerkbank(id, el) {
  const leer = document.getElementById("leer");
  if (leer) leer.remove();
  const b = el.getBBox();
  const rand = 6;
  const d = document.createElement("div");
  d.className = "kachel";
  d.dataset.id = id;
  d.onclick = () => kachelKlick(id, d);
  d.innerHTML = `<svg viewBox="${b.x - rand} ${b.y - rand} ${b.width + 2 * rand} ${b.height + 2 * rand}">
      <use href="#p-${id}"></use></svg><span>${TEILE[id].name.replace(/ \(.*\)/, "")}</span>`;
  kacheln.appendChild(d);
}

function fertig() {
  karte.innerHTML = `<h2>Alles ausgebaut</h2>
    <p>Neun Teile, und jedes hat eine Aufgabe im EVA-Prinzip:</p>
    <table class="eva">
      <tr><td>Eingabe</td><td>— nichts davon! Tastatur und Maus stecken <b>außen</b> am Gehäuse. Bei Von Neumann heißt das das Eingabewerk.</td></tr>
      <tr><td>Verarbeitung</td><td>CPU, dazu das Mainboard als Verbindung</td></tr>
      <tr><td>Ausgabe</td><td>Grafikkarte</td></tr>
      <tr><td>Speicher</td><td>RAM (flüchtig) und SSD (dauerhaft)</td></tr>
      <tr><td>Versorgung</td><td>Netzteil, Kühler, Gehäuse</td></tr>
    </table>
    <div class="wie"><b>Von Neumann:</b> Rechenwerk und Steuerwerk sitzen in der CPU, daneben der
    Speicher, dazu Ein- und Ausgabewerk — verbunden durch den Bus auf dem Mainboard. Das
    Entscheidende: Im Speicher liegt auch das <b>Programm</b> selbst. So ist jeder Rechner gebaut,
    seit 1945.<br><br>Dieselben Bausteine stecken in Handy, Konsole und Router — nur kleiner und
    fest verlötet.</div>
    <p class="wie">Rechts oben siehst du, wie weit du bist.</p>`;
  sagen("Fertig. Der Rechner ist zerlegt — und du weißt, was du in der Hand hältst.", "gut");
  zeigeDialog(`<h2>Ausbau geschafft — 9 von 9</h2>
    <p class="frage">Jetzt umgekehrt: <b>Bau den Rechner wieder zusammen.</b><br>
    Zu jedem Teil kommt eine Frage — die Antwort stand vorhin beim Ausbau daneben.</p>
    <div class="zeile">
      <button class="gross" id="los">Jetzt zusammenbauen →</button>
      <button id="spaeter">Erst die Übersicht lesen</button>
    </div>`);
  document.getElementById("los").onclick = () => { zuDialog(); starteEinbau(); };
  document.getElementById("spaeter").onclick = () => {
    zuDialog();
    sagen('Wenn du so weit bist: <button id="los2">Jetzt zusammenbauen →</button>');
    document.getElementById("los2").onclick = starteEinbau;
  };
}

function aufgabe() {
  karte.innerHTML = `<h2>Zusammenbau</h2>
    <p>Jetzt umgekehrt: Klick die Teile auf der Werkbank in der Reihenfolge an, in der sie
    eingebaut werden. Zu jedem Teil kommt eine Frage — die Antwort stand vorhin beim Ausbau da.</p>
    <p><b>Eingebaut:</b> ${drin.size} / 9 &nbsp;·&nbsp; <b>Fehlversuche:</b> ${fehlversuche}
       &nbsp;·&nbsp; <b>Fragen richtig:</b> ${richtigeTeile}</p>
    <div class="wie">Diesmal sage ich dir nur, <b>dass</b> etwas nicht geht — den Grund musst du
    selbst wissen.</div>`;
}

function starteEinbau() {
  modus = "einbau";
  fehlversuche = 0;
  document.body.classList.add("einbau");
  document.getElementById("unterzeile").textContent =
    "Test: Bau den Rechner wieder zusammen — in der richtigen Reihenfolge.";
  document.querySelector("#werkbank h2").textContent = "Werkbank — klick ein Teil, um es einzubauen";
  fortschritt.textContent = "0 / 9 eingebaut";
  sagen("Bau den Rechner zusammen. Welches Teil kommt zuerst?");
  aufgabe();
  document.getElementById("kacheln").scrollIntoView({ block: "nearest" });
}

function kachelKlick(id, kachel) {
  if (modus !== "einbau" || drin.has(id)) return;
  const fehlt = EINBAU[id].filter(b => !drin.has(b));
  if (fehlt.length) {
    fehlversuche++;
    const b = fehlt[fehlt.length - 1];
    sagen("Das geht so noch nicht. " + (EINBAUTEXT[id] || EINBAUTEXT[b] || ""), "fehler");
    aufgabe();
    return;
  }
  teilfrage(id, kachel);
}

function mischen(n) {
  const f = n.map((_, i) => i);
  for (let i = f.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [f[i], f[j]] = [f[j], f[i]];
  }
  return f;
}

function teilfrage(id, kachel) {
  const q = TEILFRAGE[id];
  zeigeDialog(`<div class="rolle">${TEILE[id].name.replace(/ \(.*\)/, "")}</div>
    <p class="frage">${q.f}</p>
    <p class="woher">Bevor das Teil eingebaut wird.</p>` +
    mischen(q.a).map(i => `<button class="antwort" data-i="${i}">${q.a[i]}</button>`).join(""));
  dialog.querySelectorAll(".antwort").forEach(b => b.onclick = () => {
    const gut = +b.dataset.i === q.r;
    if (gut) richtigeTeile++;
    zeigeDialog(`<div class="rueck ${gut ? "gut" : "fehler"}">
        ${gut ? "<b>Richtig.</b> " + q.a[q.r]
              : "<b>Nicht ganz.</b> Richtig ist: " + q.a[q.r]}</div>
      <div class="zeile"><button class="gross" id="weiter">${TEILE[id].name} einbauen →</button></div>`);
    document.getElementById("weiter").onclick = () => {
      zuDialog();
      sagen(gut ? "<b>" + TEILE[id].name + "</b> sitzt." : "<b>" + TEILE[id].name + "</b> sitzt — die Frage schaust du dir noch mal an.",
            gut ? "gut" : "fehler");
      einbauen(id, kachel);
    };
  });
}

function einbauen(id, kachel) {
  drin.add(id);
  svg.querySelector(`.teil[data-id="${id}"]`).classList.remove("weg");
  kachel.remove();
  fortschritt.textContent = drin.size + " / 9 eingebaut";
  if (drin.size === REIHENFOLGE.length) {
    const lob = fehlversuche === 0 && richtigeTeile === 9 ? "Kein Fehlversuch, keine falsche Antwort. Das sitzt."
      : fehlversuche <= 3 && richtigeTeile >= 7 ? "Guter Durchgang — Reihenfolge und Aufgaben stimmen weitgehend."
      : "Geschafft. Geh die Teile noch einmal durch, da war einiges Raten dabei.";
    karte.innerHTML = `<h2>Der Rechner steht</h2><p>${lob}</p>
      <p><b>Reihenfolge:</b> ${fehlversuche} ${fehlversuche === 1 ? "Fehlversuch" : "Fehlversuche"} &nbsp;·&nbsp;
         <b>Fragen:</b> ${richtigeTeile} von 9 richtig</p>
      <div class="wie"><b>Die Reihenfolge:</b> Mainboard ins Gehäuse · CPU in den Sockel ·
      Kühler auf die CPU · RAM in die Bänke · Grafikkarte in den PCIe-Steckplatz · SSD und
      Netzteil · Seitenwand zu · und erst ganz zum Schluss der Strom.</div>
      `;
    sagen("Fertig zusammengebaut.", "gut");
    document.getElementById("kacheln").innerHTML = '<span id="leer">Alles wieder eingebaut.</span>';
    zeigeDialog(`<h2>Der Rechner steht wieder</h2>
      <p class="frage">${lob}<br>
      <b>Reihenfolge:</b> ${fehlversuche} ${fehlversuche === 1 ? "Fehlversuch" : "Fehlversuche"} &nbsp;·&nbsp;
      <b>Fragen:</b> ${richtigeTeile} von 9 richtig</p>
      <div class="zeile"><button class="gross" id="quiz">Drei Fragen zum Schluss →</button></div>`);
    document.getElementById("quiz").onclick = () => frage(0, 0);
  } else {
    sagen("<b>" + TEILE[id].name + "</b> sitzt.", "gut");
    aufgabe();
  }
}

function frage(nr, richtig) {
  if (nr >= FRAGEN.length) {
    zeigeDialog(`<h2>${richtig} von ${FRAGEN.length} richtig</h2>
      <p class="frage">${richtig === FRAGEN.length ? "Alles sitzt — Aufbau und Prinzip."
        : richtig >= 2 ? "Guter Stand. Schau dir die falsche Antwort noch einmal an."
        : "Geh die Teile noch einmal durch — vor allem Speicher und CPU."}</p>
      <div class="zeile"><button class="gross" onclick="location.reload()">Von vorne</button>
      <button id="fertigzu">Schließen</button></div>`);
    document.getElementById("fertigzu").onclick = zuDialog;
    sagen("Geschafft.", "gut");
    return;
  }
  const q = FRAGEN[nr];
  zeigeDialog(`<div class="rolle">Frage ${nr + 1} von ${FRAGEN.length}</div>
    <p class="frage">${q.f}</p>` +
    mischen(q.a).map(i => `<button class="antwort" data-i="${i}">${q.a[i]}</button>`).join(""));
  dialog.querySelectorAll(".antwort").forEach(b => b.onclick = () => {
    const gut = +b.dataset.i === q.r;
    zeigeDialog(`<div class="rueck ${gut ? "gut" : "fehler"}">
        <b>${gut ? "Richtig." : "Nicht ganz."}</b> ${q.w}</div>
      <div class="zeile"><button class="gross" id="weiter">Weiter →</button></div>`);
    document.getElementById("weiter").onclick = () => frage(nr + 1, richtig + (gut ? 1 : 0));
  });
}

svg.querySelectorAll(".teil").forEach(g => {
  g.addEventListener("click", () => {
    const id = g.dataset.id;
    if (modus === "einbau" || raus.has(id)) return;
    if (TEILE[id].braucht.some(b => !raus.has(b))) {
      sagen(warum(id), "fehler");
      return;
    }
    raus.add(id);
    aufWerkbank(id, g.querySelector("g"));
    g.classList.add("weg");
    zeigen(id);
    fortschritt.textContent = raus.size + " / 9 ausgebaut";
    if (raus.size === REIHENFOLGE.length) fertig();
    else sagen("<b>" + TEILE[id].name + "</b> ist ausgebaut. Was kommt als Nächstes?", "gut");
  });
});

/* Direkteinstieg für die Folgestunde: ?start=einbau überspringt den Ausbau */
function nurZusammenbau() {
  REIHENFOLGE.forEach(id => {
    const g = svg.querySelector(`.teil[data-id="${id}"]`);
    raus.add(id);
    aufWerkbank(id, g.querySelector("g"));
    g.classList.add("weg");
  });
  starteEinbau();
  sagen("Der Rechner ist zerlegt. Bau ihn zusammen — und beantworte zu jedem Teil die Frage.");
}

if (new URLSearchParams(location.search).get("start") === "einbau") nurZusammenbau();
else karte.innerHTML = START;
</script>
</body>
</html>
